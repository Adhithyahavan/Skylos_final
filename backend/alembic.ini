# Skylos — Alembic configuration
#
# Migrations run automatically at backend startup (database.init_db).
# Manual use, from the backend directory:
#   alembic current            # show the revision of the configured database
#   alembic upgrade head       # apply pending migrations
#   alembic revision --autogenerate -m "describe change"   # after editing models.py
#
# The database URL is NOT stored here; it comes from DATABASE_URL (config.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
